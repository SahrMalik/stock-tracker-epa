version: 2
updates:
  # Python dependencies for Lambda
  - package-ecosystem: "pip"
    directory: "/lambda"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Python dependencies for CDK
  - package-ecosystem: "pip"
    directory: "/cdk-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
